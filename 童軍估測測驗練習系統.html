<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童軍永備尺與估測測驗系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c5e1a; text-align: center; border-bottom: 2px solid #2c5e1a; padding-bottom: 10px; }
        h2 { color: #387c2b; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; background: #eee; border: 1px solid #ddd; border-bottom: none; margin-right: 5px; border-radius: 5px 5px 0 0; }
        .tab.active { background: #2c5e1a; color: white; border-color: #2c5e1a; font-weight: bold; }
        .content { display: none; padding: 20px; border: 1px solid #ddd; border-top: none; border-radius: 0 5px 5px 5px; background: #fafafa; }
        .content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2c5e1a; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; margin-top: 10px; }
        button:hover { background: #1a4010; }
        .result { margin-top: 15px; padding: 15px; border-radius: 4px; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .question-box { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 15px; font-size: 18px; }
        .info-panel { background: #e2eef7; padding: 10px; border-left: 4px solid #3b82f6; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⛺ 童軍永備尺與估測測驗系統</h1>
    
    <div class="info-panel" id="current-measures">
        <strong>目前永備尺設定：</strong> 
        單步長: <span id="disp-pace">尚未設定</span> m | 
        庹長: <span id="disp-arm">尚未設定</span> m | 
        指距: <span id="disp-span">尚未設定</span> m
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(event, 'calibration')">1. 永備尺校準</div>
        <div class="tab" onclick="switchTab(event, 'area-test')">2. 面積估測</div>
        <div class="tab" onclick="switchTab(event, 'volume-test')">3. 體積估測</div>
    </div>

    <!-- 1. 永備尺校準 -->
    <div id="calibration" class="content active">
        <h2>📏 建立你的專屬永備尺</h2>
        <p>請實際測量後，輸入你的身體數值（單位：公分 cm）。系統會自動換算為公尺 (m) 供後續測驗使用。</p>
        <div class="form-group">
            <label for="pace">單步長 (公分) - 平常走路的一步長度</label>
            <input type="number" id="pace" placeholder="例如：65">
        </div>
        <div class="form-group">
            <label for="arm">庹長 (公分) - 雙臂平舉展開的長度</label>
            <input type="number" id="arm" placeholder="例如：160">
        </div>
        <div class="form-group">
            <label for="span">指距 (公分) - 大拇指到小指張開的長度</label>
            <input type="number" id="span" placeholder="例如：20">
        </div>
        <button onclick="saveMeasures()">儲存並更新永備尺</button>
        <div id="calib-msg" class="result success"></div>
    </div>

    <!-- 2. 面積估測測驗 -->
    <div id="area-test" class="content">
        <h2>🏕️ 面積估測挑戰</h2>
        <p>利用你設定的「單步長」來計算營地面積。</p>
        <button onclick="generateAreaQuestion()" style="background:#0056b3; margin-bottom:15px;">產生新題目</button>
        
        <div id="area-q-container" style="display:none;">
            <div class="question-box" id="area-question"></div>
            <div class="form-group">
                <label for="area-answer">你的計算結果是幾「平方公尺」(m²)？ (請四捨五入到小數點後第一位)</label>
                <input type="number" id="area-answer" step="0.1" placeholder="輸入數字">
            </div>
            <button onclick="checkAreaAnswer()">送出答案</button>
            <div id="area-msg" class="result"></div>
        </div>
    </div>

    <!-- 3. 體積估測測驗 -->
    <div id="volume-test" class="content">
        <h2>📦 體積估測挑戰</h2>
        <p>利用你的「指距」來計算裝備箱或水塔的體積。</p>
        <button onclick="generateVolumeQuestion()" style="background:#0056b3; margin-bottom:15px;">產生新題目</button>
        
        <div id="vol-q-container" style="display:none;">
            <div class="question-box" id="vol-question"></div>
            <div class="form-group">
                <label for="vol-answer">你的計算結果是幾「立方公尺」(m³)？ (請四捨五入到小數點後第三位)</label>
                <input type="number" id="vol-answer" step="0.001" placeholder="輸入數字">
            </div>
            <button onclick="checkVolAnswer()">送出答案</button>
            <div id="vol-msg" class="result"></div>
        </div>
    </div>

</div>

<script>
    // 儲存全域變數 (單位皆轉為公尺)
    let measures = { pace: 0, arm: 0, span: 0 };
    let currentAreaAns = 0;
    let currentVolAns = 0;

    // 頁籤切換邏輯
    function switchTab(evt, tabName) {
        let i, content, tabs;
        content = document.getElementsByClassName("content");
        for (i = 0; i < content.length; i++) {
            content[i].classList.remove("active");
        }
        tabs = document.getElementsByClassName("tab");
        for (i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove("active");
        }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // 儲存永備尺
    function saveMeasures() {
        let p = parseFloat(document.getElementById('pace').value);
        let a = parseFloat(document.getElementById('arm').value);
        let s = parseFloat(document.getElementById('span').value);

        if(!p || !a || !s) {
            alert("請填寫所有數值！");
            return;
        }

        // 公分轉公尺
        measures.pace = p / 100;
        measures.arm = a / 100;
        measures.span = s / 100;

        document.getElementById('disp-pace').innerText = measures.pace;
        document.getElementById('disp-arm').innerText = measures.arm;
        document.getElementById('disp-span').innerText = measures.span;

        let msg = document.getElementById('calib-msg');
        msg.innerText = "設定成功！請切換到測驗區進行練習。";
        msg.style.display = "block";
        msg.className = "result success";
    }

    // 檢查是否已設定永備尺
    function checkSetup() {
        if(measures.pace === 0) {
            alert("請先完成「永備尺校準」！");
            return false;
        }
        return true;
    }

    // --- 面積測驗邏輯 ---
    function generateAreaQuestion() {
        if(!checkSetup()) return;
        
        // 隨機產生步數 (長10~30, 寬10~30)
        let lengthPaces = Math.floor(Math.random() * 21) + 10;
        let widthPaces = Math.floor(Math.random() * 21) + 10;
        
        let qText = `你正在測量一個長方形的紮營地。你沿著長邊走了 <b>${lengthPaces} 步</b>，沿著寬邊走了 <b>${widthPaces} 步</b>。請問這個營地的面積大約是多少平方公尺？`;
        document.getElementById('area-question').innerHTML = qText;
        
        // 計算標準答案：(長步數 * 步長) * (寬步數 * 步長)
        let actualArea = (lengthPaces * measures.pace) * (widthPaces * measures.pace);
        currentAreaAns = Math.round(actualArea * 10) / 10; // 四捨五入到小數第一位

        document.getElementById('area-q-container').style.display = "block";
        document.getElementById('area-msg').style.display = "none";
        document.getElementById('area-answer').value = "";
    }

    function checkAreaAnswer() {
        let userAns = parseFloat(document.getElementById('area-answer').value);
        let msg = document.getElementById('area-msg');
        msg.style.display = "block";

        if(isNaN(userAns)) {
            msg.innerText = "請輸入數字！";
            msg.className = "result error";
            return;
        }

        // 容錯範圍 +/- 0.2
        if(Math.abs(userAns - currentAreaAns) <= 0.2) {
            msg.innerHTML = `✅ 答對了！標準答案是 <b>${currentAreaAns}</b> m²。做得好！`;
            msg.className = "result success";
        } else {
            msg.innerHTML = `❌ 算錯囉！標準答案是 <b>${currentAreaAns}</b> m²。<br>算法：(長步數 × 步長) × (寬步數 × 步長) = (${measures.pace} × ...) × (${measures.pace} × ...)`;
            msg.className = "result error";
        }
    }

    // --- 體積測驗邏輯 ---
    function generateVolumeQuestion() {
        if(!checkSetup()) return;
        
        // 隨機產生指距數 (長寬高 2~8 拃)
        let lSpan = Math.floor(Math.random() * 7) + 2;
        let wSpan = Math.floor(Math.random() * 7) + 2;
        let hSpan = Math.floor(Math.random() * 7) + 2;
        
        let qText = `你要計算一個童軍裝備木箱的體積。你用手量測，長度是 <b>${lSpan} 個指距</b>，寬度是 <b>${wSpan} 個指距</b>，高度是 <b>${hSpan} 個指距</b>。請問體積大約是多少立方公尺？`;
        document.getElementById('vol-question').innerHTML = qText;
        
        // 計算標準答案
        let actualVol = (lSpan * measures.span) * (wSpan * measures.span) * (hSpan * measures.span);
        currentVolAns = Math.round(actualVol * 1000) / 1000; // 四捨五入到小數第三位

        document.getElementById('vol-q-container').style.display = "block";
        document.getElementById('vol-msg').style.display = "none";
        document.getElementById('vol-answer').value = "";
    }

    function checkVolAnswer() {
        let userAns = parseFloat(document.getElementById('vol-answer').value);
        let msg = document.getElementById('vol-msg');
        msg.style.display = "block";

        if(isNaN(userAns)) {
            msg.innerText = "請輸入數字！";
            msg.className = "result error";
            return;
        }

        // 容錯範圍 +/- 0.005
        if(Math.abs(userAns - currentVolAns) <= 0.005) {
            msg.innerHTML = `✅ 答對了！標準答案是 <b>${currentVolAns}</b> m³。很厲害！`;
            msg.className = "result success";
        } else {
            msg.innerHTML = `❌ 算錯囉！標準答案是 <b>${currentVolAns}</b> m³。<br>算法：(長 × 寬 × 高) 的指距次數各自乘上你的指距長度(${measures.span}m) 再相乘。`;
            msg.className = "result error";
        }
    }
</script>

</body>
</html>
