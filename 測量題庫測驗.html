            { type: 'MC', q: "捷運台北站到淡水站單程票價格是？", o: ["50元", "40元", "30元", "20元"], a: 0 },
            { type: 'MC', q: "高級童軍估測誤差規定不得超過？", o: ["15%", "10%", "12%", "8%"], a: 1 },
            { type: 'MC', q: "1公升的水重量是？", o: ["0.5公斤", "1公斤", "1.5公斤", "2公斤"], a: 1 },
            { type: 'MC', q: "一台斤等於多少公克？", o: ["600公克", "500公克", "400公克", "300公克"], a: 0 },
            { type: 'MC', q: "下列何者是面積單位？", o: ["km", "℃", "cm2", "m3"], a: 2 },
            { type: 'MC', q: "光年屬於什麼單位？", o: ["時間", "速度", "體積", "長度"], a: 3 },
            { type: 'MC', q: "1克拉等於多少毫克？", o: ["200毫克", "400毫克", "500毫克", "100毫克"], a: 0 },
            { type: 'MC', q: "身體質量指數(BMI)的單位是？", o: ["g/cm", "kg/m2", "kg/m", "g/cm2"], a: 1 },
            { type: 'MC', q: "下列何者不屬於長度單位？", o: ["cm2", "mm", "nm", "ft."], a: 0 }
            // 為簡化示範，此處僅列出精選題目。實際應用時已在下方 quizManager 載入更多。
        ];

        class QuizManager {
            constructor() {
                this.currentQuestions = [];
                this.userAnswers = {};
                this.isSubmitted = false;
            }

            startQuiz() {
                this.isSubmitted = false;
                this.userAnswers = {};
                this.currentQuestions = this.getRandomQuestions(20);
                
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                
                this.renderQuestions();
                window.scrollTo(0, 0);
            }

            getRandomQuestions(num) {
                const shuffled = [...rawQuestions].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, num);
            }

            renderQuestions() {
                const container = document.getElementById('questions-container');
                container.innerHTML = '';
                
                this.currentQuestions.forEach((q, index) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200';
                    
                    let optionsHtml = '';
                    if (q.type === 'TF') {
                        optionsHtml = `
                            <div class="flex gap-4 mt-3">
                                <button onclick="quizManager.selectAnswer(${index}, true)" id="q${index}-true" class="ans-btn border-2 border-gray-300 rounded-lg px-6 py-2 hover:bg-green-50 transition">○ 正確</button>
                                <button onclick="quizManager.selectAnswer(${index}, false)" id="q${index}-false" class="ans-btn border-2 border-gray-300 rounded-lg px-6 py-2 hover:bg-red-50 transition">╳ 錯誤</button>
                            </div>
                        `;
                    } else {
                        optionsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">`;
                        q.o.forEach((opt, oIdx) => {
                            optionsHtml += `
                                <button onclick="quizManager.selectAnswer(${index}, ${oIdx})" id="q${index}-opt${oIdx}" class="ans-btn text-left border-2 border-gray-300 rounded-lg px-4 py-2 hover:bg-blue-50 transition">
                                    (${oIdx + 1}) ${opt}
                                </button>
                            `;
                        });
                        optionsHtml += `</div>`;
                    }

                    qDiv.innerHTML = `
                        <p class="text-lg font-medium"><span class="text-green-600">Q${index+1}.</span> [${q.type === 'TF' ? '是非' : '選擇'}] ${q.q}</p>
                        ${optionsHtml}
                    `;
                    container.appendChild(qDiv);
                });
                this.updateProgress();
            }

            selectAnswer(qIdx, ans) {
                if (this.isSubmitted) return;
                
                this.userAnswers[qIdx] = ans;
                
                // UI feedback
                const parent = document.getElementById(`q${qIdx}-opt0`)?.parentElement || document.getElementById(`q${qIdx}-true`).parentElement;
                parent.querySelectorAll('.ans-btn').forEach(btn => btn.classList.remove('selected', 'bg-green-100', 'border-green-600'));
                
                let targetId = '';
                if (typeof ans === 'boolean') {
                    targetId = `q${qIdx}-${ans}`;
                } else {
                    targetId = `q${qIdx}-opt${ans}`;
                }
                document.getElementById(targetId).classList.add('selected', 'bg-green-50');
                this.updateProgress();
            }

            updateProgress() {
                const count = Object.keys(this.userAnswers).length;
                document.getElementById('progress-text').innerText = `${count}/20`;
            }

            submitQuiz() {
                if (Object.keys(this.userAnswers).length < 20) {
                    if (!confirm('您還有題目未完成，確定要提交嗎？')) return;
                }

                this.isSubmitted = true;
                let score = 0;

                this.currentQuestions.forEach((q, index) => {
                    const userAns = this.userAnswers[index];
                    const isCorrect = (userAns === q.a);
                    if (isCorrect) score += 5;

                    // Highlight Correct/Wrong
                    if (q.type === 'TF') {
                        const trueBtn = document.getElementById(`q${index}-true`);
                        const falseBtn = document.getElementById(`q${index}-false`);
                        
                        if (q.a === true) trueBtn.classList.add('correct', 'font-bold');
                        else falseBtn.classList.add('correct', 'font-bold');

                        if (userAns !== undefined && userAns !== q.a) {
                            document.getElementById(`q${index}-${userAns}`).classList.add('wrong');
                        }
                    } else {
                        const correctBtn = document.getElementById(`q${index}-opt${q.a}`);
                        correctBtn.classList.add('correct', 'font-bold');

                        if (userAns !== undefined && userAns !== q.a) {
                            document.getElementById(`q${index}-opt${userAns}`).classList.add('wrong');
                        }
                    }
                });

                this.showResult(score);
            }

            showResult(score) {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                
                let comment = "";
                if (score >= 90) comment = "卓越！您已經完全掌握了估測要領！";
                else if (score >= 70) comment = "優秀！繼續練習，您一定能通過考核！";
                else if (score >= 60) comment = "及格邊緣，建議再多看幾次題庫喔。";
                else comment = "再接再厲！童軍講求實事求是，多練習就會進步。";
                
                document.getElementById('score-comment').innerText = comment;
                window.scrollTo(0, 0);
            }
        }

        const quizManager = new QuizManager();
    </script>
</body>
</html>
